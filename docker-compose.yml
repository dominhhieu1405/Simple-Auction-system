services:
  api:
    image: ghcr.io/dominhhieu1405/simple-auction-system:${APP_VERSION:-latest}
    container_name: simple-auction-api

    ports:
      - "${SERVER_PORT:-8080}:8080"

    environment:
      JWT_SECRET: ${JWT_SECRET:?Hay dat JWT_SECRET trong file .env}

    volumes:
      - auction_data:/app/data

    restart: unless-stopped

volumes:
  auction_data: