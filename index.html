<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auction Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-3">
    <h4 class="mb-3">Simple Auction – Test</h4>

    <div class="row g-3">
        <!-- Cột trái: tài khoản + tạo phiên -->
        <div class="col-lg-4">
            <div class="card mb-3"><div class="card-body">
                <h6>Tài khoản</h6>
                <div id="who" class="small text-muted mb-2">Chưa đăng nhập</div>
                <input id="username" class="form-control mb-2" placeholder="Username">
                <input id="password" type="password" class="form-control mb-2" placeholder="Password">
                <button id="btnRegister" class="btn btn-outline-primary btn-sm">Đăng ký</button>
                <button id="btnLogin" class="btn btn-primary btn-sm">Đăng nhập</button>
                <button id="btnLogout" class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
                <button id="btnMyBids" class="btn btn-outline-dark btn-sm">Bid của tôi</button>
            </div></div>

            <div class="card"><div class="card-body">
                <h6>Tạo phiên</h6>
                <input id="title" class="form-control mb-2" placeholder="Tiêu đề">
                <textarea id="description" class="form-control mb-2" rows="2" placeholder="Mô tả"></textarea>
                <div class="row g-2 mb-2">
                    <div class="col"><input id="startingPrice" type="number" class="form-control" placeholder="Giá khởi điểm" value="1000000"></div>
                    <div class="col"><input id="minIncrement" type="number" class="form-control" placeholder="Bước giá" value="50000"></div>
                </div>
                <input id="endTime" type="datetime-local" class="form-control mb-2">
                <button id="btnCreate" class="btn btn-success btn-sm w-100">Tạo phiên</button>
            </div></div>
        </div>

        <!-- Cột phải: danh sách + chi tiết -->
        <div class="col-lg-8">
            <div class="card mb-3"><div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <h6 class="mb-0">Danh sách phiên <small class="text-muted">(bấm vào dòng để xem)</small></h6>
                    <button id="btnReload" class="btn btn-outline-primary btn-sm">Tải lại</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead><tr><th>ID</th><th>Tiêu đề</th><th>Owner</th><th>Giá KĐ</th><th>Trạng thái</th><th>Kết thúc</th></tr></thead>
                        <tbody id="auctions"></tbody>
                    </table>
                </div>
            </div></div>

            <div id="detail" class="card d-none"><div class="card-body">
                <h6 id="dTitle"></h6>
                <div id="dInfo" class="small text-muted mb-2"></div>
                <div class="input-group input-group-sm mb-2">
                    <input id="amount" type="number" class="form-control" placeholder="Số tiền">
                    <span class="input-group-text">×</span>
                    <input id="times" type="number" class="form-control" value="1" min="1" style="max-width:70px" title="Gửi bao nhiêu request cùng lúc">
                    <button id="btnBid" class="btn btn-primary">Đặt giá</button>
                    <button id="btnClose" class="btn btn-warning">Đóng phiên</button>
                    <button id="btnDelete" class="btn btn-danger">Xóa</button>
                </div>
                <table class="table table-sm mb-0">
                    <thead><tr><th>ID</th><th>User</th><th>Số tiền</th><th>Thời gian</th></tr></thead>
                    <tbody id="bids"></tbody>
                </table>
            </div></div>
        </div>
    </div>

    <!-- Log request/response -->
    <div class="card mt-3"><div class="card-body">
        <div class="d-flex justify-content-between mb-2">
            <h6 class="mb-0">Log</h6>
            <button id="btnClear" class="btn btn-outline-secondary btn-sm">Xóa log</button>
        </div>
        <pre id="log" class="small mb-0" style="max-height:300px;overflow:auto"></pre>
    </div></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    let token = localStorage.getItem('token') || '';
    let currentId = null;

    const esc = s => $('<div>').text(s ?? '').html();
    const money = n => Number(n).toLocaleString('vi-VN');
    const time = s => new Date(s).toLocaleString('vi-VN');

    // Ghi mọi request/response vào khung Log
    function log(method, path, status, body) {
        const color = status >= 200 && status < 300 ? 'text-success' : 'text-danger';
        $('#log').prepend(
            `<span class="${color}">${new Date().toLocaleTimeString()} ${method} ${esc(path)} → ${status}</span>\n` +
            `${esc(JSON.stringify(body, null, 2))}\n\n`
        );
    }

    // Gọi API, tự gắn token và ghi log
    function api(method, path, data) {
        return $.ajax({
            url: '/api' + path,
            method: method,
            contentType: 'application/json',
            data: data ? JSON.stringify(data) : undefined,
            headers: token ? { Authorization: 'Bearer ' + token } : {},
        })
            .done((res, _, xhr) => log(method, path, xhr.status, res))
            .fail(xhr => log(method, path, xhr.status, xhr.responseJSON || xhr.responseText));
    }

    // ---------- Tài khoản ----------
    const creds = () => ({ username: $('#username').val(), password: $('#password').val() });

    function loadMe() {
        if (!token) return $('#who').text('Chưa đăng nhập');
        api('GET', '/users/me')
            .done(u => $('#who').text(`Đã đăng nhập: ${u.username} (id ${u.id})`))
            .fail(() => { token = ''; localStorage.removeItem('token'); $('#who').text('Token không hợp lệ, đăng nhập lại'); });
    }

    $('#btnRegister').click(() => api('POST', '/auth/register', creds()));
    $('#btnLogin').click(() => api('POST', '/auth/login', creds()).done(res => {
        token = res.token;
        localStorage.setItem('token', token);
        loadMe();
    }));
    $('#btnLogout').click(() => { token = ''; localStorage.removeItem('token'); loadMe(); });
    $('#btnMyBids').click(() => api('GET', '/users/me/bids'));

    // ---------- Danh sách phiên ----------
    function loadAuctions() {
        api('GET', '/auctions').done(list => {
            $('#auctions').html(list.map(a => `
      <tr role="button" data-id="${a.id}" class="${a.id === currentId ? 'table-active' : ''}">
        <td>${a.id}</td>
        <td>${esc(a.title)}</td>
        <td>${a.owner_id}</td>
        <td>${money(a.starting_price)}</td>
        <td><span class="badge ${a.status === 'active' ? 'bg-success' : 'bg-secondary'}">${esc(a.status)}</span></td>
        <td>${time(a.end_time)}</td>
      </tr>`).join(''));
        });
    }

    $('#auctions').on('click', 'tr', function () {
        currentId = $(this).data('id');
        $(this).addClass('table-active').siblings().removeClass('table-active');
        loadDetail();
    });

    $('#btnCreate').click(() => {
        const end = $('#endTime').val();
        api('POST', '/auctions', {
            title: $('#title').val(),
            description: $('#description').val(),
            starting_price: Number($('#startingPrice').val()),
            min_increment: Number($('#minIncrement').val()),
            end_time: end ? new Date(end).toISOString() : null,
        }).done(loadAuctions);
    });

    // ---------- Chi tiết phiên ----------
    function loadDetail() {
        if (!currentId) return;
        api('GET', '/auctions/' + currentId).done(a => {
            $('#detail').removeClass('d-none');
            $('#dTitle').text(`#${a.id} ${a.title}`);
            $('#dInfo').text(
                `${a.description || '(không mô tả)'} | Owner ${a.owner_id} | Giá KĐ ${money(a.starting_price)} | ` +
                `Bước ${money(a.min_increment)} | ${a.status} | Kết thúc ${time(a.end_time)}`
            );

            api('GET', `/auctions/${currentId}/bids`).done(bids => {
                $('#bids').html(bids.map(b =>
                    `<tr><td>${b.id}</td><td>${b.user_id}</td><td>${money(b.amount)}</td><td>${time(b.created_at)}</td></tr>`
                ).join(''));
                // Gợi ý số tiền tối thiểu cho lần bid tiếp theo
                const next = bids.length ? Math.max(...bids.map(b => b.amount)) + a.min_increment : a.starting_price;
                $('#amount').val(next);
            });
        });
    }

    $('#btnBid').click(() => {
        const amount = Number($('#amount').val());
        const n = Math.max(1, Number($('#times').val()) || 1);
        const reqs = [];
        for (let i = 0; i < n; i++) reqs.push(api('POST', `/auctions/${currentId}/bids`, { amount }));
        Promise.allSettled(reqs).then(loadDetail);
    });

    $('#btnClose').click(() => api('POST', `/auctions/${currentId}/close`).done(() => { loadDetail(); loadAuctions(); }));

    $('#btnDelete').click(() => {
        if (!confirm(`Xóa phiên #${currentId}?`)) return;
        api('DELETE', '/auctions/' + currentId).done(() => {
            currentId = null;
            $('#detail').addClass('d-none');
            loadAuctions();
        });
    });

    // ---------- Khởi động ----------
    $('#btnReload').click(loadAuctions);
    $('#btnClear').click(() => $('#log').empty());

    // Mặc định thời gian kết thúc = 1 giờ sau
    const d = new Date(Date.now() + 3600e3);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    $('#endTime').val(d.toISOString().slice(0, 16));

    loadMe();
    loadAuctions();
</script>
</body>
</html>
